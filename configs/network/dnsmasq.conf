# Only listen on the AP interface
interface=ap0
bind-dynamic

# DHCP Range
dhcp-range=192.168.4.10,192.168.4.100,255.255.255.0,24h

# DHCP Options
# 3 = Router (Gateway). Not needed if no internet access is required through AP,
# but usually set to the RPi IP for local access.
dhcp-option=3,192.168.4.1
# 6 = DNS Server
dhcp-option=6,192.168.4.1

# Optimization for low latency
# Avoid DNS lookups for local queries
domain-needed
bogus-priv
no-resolv
local=/observatory.local/
address=/observatory.local/192.168.4.1
